name: Testa LÄCKAGET

# Steg 1: ljudmotorn testas på varje push (ca 1 min) och demoljud renderas.
# Pluginet (JUCE), panelen och zipparna kommer i steg 2-4.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Testa motorn
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc tests/core_test.cpp -o core_test
          ./core_test

      - name: Rendera demo
        run: |
          g++ -std=c++17 -O2 -Isrc tests/render_demo.cpp -o render_demo
          mkdir -p demo && ./render_demo demo

      - name: Ladda upp demon
        uses: actions/upload-artifact@v4
        with:
          name: LACKAGET-demo
          path: demo/*.wav
          retention-days: 14
