name: Bygg VEVHUS (prototyp, bara Mac)
on:
  push:
    branches: [ vevhus ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - name: Packa och lägg på grenen vevhus-zips
        run: |
          ART=build/Vevhus_artefacts/Release
          mkdir -p dist/VEVHUS-macOS
          cp -R "$ART/VST3/VEVHUS.vst3" "$ART/AU/VEVHUS.component" dist/VEVHUS-macOS/
          codesign --force --deep -s - dist/VEVHUS-macOS/VEVHUS.vst3
          codesign --force --deep -s - dist/VEVHUS-macOS/VEVHUS.component
          cp installer/installera.command installer/LAS_MIG.txt dist/VEVHUS-macOS/
          chmod +x dist/VEVHUS-macOS/installera.command
          mkdir zips && (cd dist && ditto -c -k --keepParent VEVHUS-macOS ../zips/VEVHUS-macOS.zip)
          cd zips
          git init -q -b vevhus-zips
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "VEVHUS ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vevhus-zips
