name: Testa MOTSTÅND

# Steg 2 av 5: bara motorn och rösterna testas (billigt, ca 1 minut på Linux).
# Mac-, Windows- och Linux-byggena av pluginet läggs tillbaka i steg 5.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Testa motorn och rösterna
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Isrc tests/core_test.cpp -o core_test
          ./core_test

      - name: Rendera demo
        run: |
          g++ -std=c++17 -O2 -Isrc tests/render_demo.cpp -o render_demo
          ./render_demo MOTSTAND-demo.wav

      - name: Ladda upp demon
        uses: actions/upload-artifact@v4
        with:
          name: MOTSTAND-demo
          path: MOTSTAND-demo.wav
          retention-days: 14
