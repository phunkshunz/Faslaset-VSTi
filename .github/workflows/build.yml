name: Testa MOTSTÅND

# Steg 4e av 5: motorn testas på varje push (ca 1 min).
# Plugintestet (bygger med JUCE, ca 5 min) körs bara när pluginkoden ändras.
# Mac-, Windows- och Linux-zippar för försäljning läggs till i steg 5.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Testa motorn och rösterna
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Isrc tests/core_test.cpp -o core_test
          ./core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Isrc tests/fx_test.cpp -o fx_test
          ./fx_test
          g++ -std=c++17 -O2 -Wall -Wextra -Isrc tests/doom_test.cpp -o doom_test
          ./doom_test

      - name: Rendera demo
        run: |
          g++ -std=c++17 -O2 -Isrc tests/render_demo.cpp -o render_demo
          ./render_demo MOTSTAND-demo-ren.wav
          ./render_demo MOTSTAND-demo-vinkelslip.wav slip
          ./render_demo MOTSTAND-demo-fet.wav fet

      - name: Ladda upp demon
        uses: actions/upload-artifact@v4
        with:
          name: MOTSTAND-demo
          path: MOTSTAND-demo-*.wav
          retention-days: 14

  plugin:
    needs: motor
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Har pluginkoden ändrats?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|CMakeLists.txt|tests/plugin_test.cpp)'; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Installera beroenden
        if: steps.changed.outputs.run == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Bygg och kör plugintestet
        if: steps.changed.outputs.run == 'yes'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMOTSTAND_TESTS=ON
          cmake --build build --target MotstandTest MotstandSnapshot MotstandTour Motstand_VST3 -j 4
          ./build/MotstandTest_artefacts/Release/MotstandTest

      - name: Rendera panelbilder (till hemsidan och Payhip)
        if: steps.changed.outputs.run == 'yes'
        run: |
          ./build/MotstandSnapshot_artefacts/Release/MotstandSnapshot MOTSTAND-panel-sv.png sv 1
          ./build/MotstandSnapshot_artefacts/Release/MotstandSnapshot MOTSTAND-panel-en.png en 1
          ./build/MotstandSnapshot_artefacts/Release/MotstandSnapshot MOTSTAND-panel-sv-2x.png sv 2
          ./build/MotstandSnapshot_artefacts/Release/MotstandSnapshot MOTSTAND-panel-haveri.png sv 1 0 30
          ./build/MotstandTour_artefacts/Release/MotstandTour MOTSTAND-panel-tour.wav 7.5
          ./build/MotstandTour_artefacts/Release/MotstandTour MOTSTAND-panel-undergang.wav 9 doom
          ./build/MotstandSnapshot_artefacts/Release/MotstandSnapshot MOTSTAND-panel-undergang.png sv 1 0 56 doom

      - name: Ladda upp panelbilderna
        if: steps.changed.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: MOTSTAND-panel
          path: |
            MOTSTAND-panel-*.png
            MOTSTAND-panel-tour.wav
            MOTSTAND-panel-undergang.wav
          retention-days: 30
